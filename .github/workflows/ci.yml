name: CI

on:
  # The Swift edition ships from `main`. The frozen Tauri edition is preserved on `tauri-legacy`.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build and Test
    # Builds against the macOS 26 SDK with the package's macOS 15 deployment target (Package.swift
    # .macOS(.v15)), so this compiles the whole codebase — including the `if #available(macOS 26, *)`
    # Liquid Glass branches — for the macOS 15 floor. That is the floor's compile guarantee: a binary
    # built here reports minos 15.0. We do NOT add a macos-15 runner leg — back-deployment compiles
    # against the newest SDK, and a stock macos-15 runner ships Swift 6.1 without the macOS 26 SDK, so
    # it cannot build this package. Runtime verification on Sequoia is a manual smoke pass.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: swift build --build-system swiftbuild --arch "$(uname -m)"

      - name: Run tests
        run: |
          # Swift Build links the test bundle against PackageFrameworks/ but builds Sparkle one
          # level up, so the framework has to be reachable under that name.
          mkdir -p .build/out/Products/Debug/PackageFrameworks
          ln -sf ../Sparkle.framework .build/out/Products/Debug/PackageFrameworks/Sparkle.framework
          swift test --build-system swiftbuild --arch "$(uname -m)"

      - name: Test development sample data
        run: swift test --build-system swiftbuild --arch "$(uname -m)" -Xswiftc -DOPENUSAGE_DEVELOPMENT --filter 'DevelopmentDemoTests|DevelopmentDataModeTests'

      - name: Verify production excludes development sample data
        run: |
          production_scratch="$RUNNER_TEMP/openusage-production"
          swift build -c release --build-system swiftbuild --arch "$(uname -m)" --scratch-path "$production_scratch" --product OpenUsageBinary
          swift build -c release --build-system swiftbuild --arch "$(uname -m)" --scratch-path "$production_scratch" --product openusage-cli
          production_bin="$(swift build -c release --build-system swiftbuild --arch "$(uname -m)" --scratch-path "$production_scratch" --show-bin-path)"
          ./script/verify_no_demo.sh "$production_bin/OpenUsageBinary" "$production_bin/openusage-cli"
